name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, including any `tn` commands or config you changed.
      placeholder: |
        1. Run `tn ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: daemon-version
    attributes:
      label: Daemon version
      description: Run `curl localhost:8391/health` with the daemon running and paste the result.
      placeholder: '{"status":"ok","version":"0.6.5",...}'
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 (Apple Silicon) / Ubuntu 24.04, etc."
    validations:
      required: true

  - type: input
    id: tasknotes-version
    attributes:
      label: TaskNotes plugin version
      description: The version of the Obsidian TaskNotes plugin you're running, if relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        On macOS with the launchd service installed, the daemon log is at
        `~/Library/Logs/tn-serve.log`. Paste the lines around when the problem happened.
      render: text
    validations:
      required: false
